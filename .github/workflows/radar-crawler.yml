name: Radar Crawler (Optimized)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"  # Daily at 07:17 UTC (16:17 KST)

permissions:
  contents: write
  pages: write
  id-token: write

env:
  RADAR_CATEGORY: policy  # Update per project
  TZ: Asia/Seoul
  PYTHON_VERSION: "3.11"
  # Never smudge historical DuckDB pointers. The LFS budget is exhausted and
  # will not be increased; new snapshots are Parquet in normal Git.
  GIT_LFS_SKIP_SMUDGE: "1"

concurrency:
  group: radar-collection
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "radar-core @ git+https://github.com/ai-frendly-datahub/radar-core.git@main"
          pip install -r requirements.txt

      - name: Download Parquet overflow from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/release
          if gh release view data-overflow --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release download data-overflow \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "*.parquet" \
              --dir data/release \
              --clobber
          else
            echo "No data-overflow release yet."
          fi

      - name: Run Radar
        run: |
          python main.py --category "${{ env.RADAR_CATEGORY }}" --recent-days 7 --keep-days 90 --keep-raw-days 180 --keep-report-days 90 --per-source-limit 50 --snapshot-db --generate-report

      - name: Generate index.html
        run: |
          python -c "from policyradar.reporter import generate_index_html; from pathlib import Path; generate_index_html(Path('reports'))"

      - name: Run Policy Alert Monitor
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "## Policy Change Alerts" >> $GITHUB_STEP_SUMMARY
          python -m alerts.alert_monitor \
            --db-path data/radar_data.duckdb \
            --category "${{ env.RADAR_CATEGORY }}" \
            --hours 24 \
            --output json > alerts.json 2>&1 || true

          # Show alerts in summary
          if [ -f "alerts.json" ]; then
            ALERT_COUNT=$(python -c "import json; data=json.load(open('alerts.json')); print(data.get('alert_count', 0))" 2>/dev/null || echo "0")
            echo "Found **$ALERT_COUNT** policy change alerts" >> $GITHUB_STEP_SUMMARY
            python -m alerts.alert_monitor --db-path data/radar_data.duckdb --category "${{ env.RADAR_CATEGORY }}" --hours 24 >> $GITHUB_STEP_SUMMARY 2>&1 || true
          fi

          # Send Telegram notification if configured
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python -m alerts.telegram_notifier \
              --db-path data/radar_data.duckdb \
              --category "${{ env.RADAR_CATEGORY }}" \
              --hours 24 || true
          fi

      - name: Run Quality Checks
        if: always()
        run: |
          python scripts/check_quality.py > quality_report.txt 2>&1 || true
          cat quality_report.txt >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Archive Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_number }}
          path: quality_report.txt
          retention-days: 30

      - name: Verify dated data artifact
        run: |
          set -euo pipefail
          dates="$(date -u +%F) $(TZ=Asia/Seoul date +%F)"
          found=0
          for d in $dates; do
            if find "data/raw/$d" -type f ! -name ".gitkeep" -print -quit 2>/dev/null | grep -q .; then found=1; fi
            if find "data/snapshots/$d" -type f ! -name ".gitkeep" -print -quit 2>/dev/null | grep -q .; then found=1; fi
            if find "data/daily" -maxdepth 1 -type f -name "$d*" -print -quit 2>/dev/null | grep -q .; then found=1; fi
            if find "data/parquet" -type f -name "*$d*.parquet" -print -quit 2>/dev/null | grep -q .; then found=1; fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No dated data artifact found for UTC/KST dates: $dates"
            find data -maxdepth 3 -type f \( -path "*/raw/*" -o -path "*/daily/*" -o -path "*/snapshots/*" \) | sort | tail -50 || true
            exit 1
          fi

      - name: Upload Parquet overflow to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f data/release/UPLOAD ]; then
            echo "No overflow Parquet to publish."
            exit 0
          fi
          if ! gh release view data-overflow --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create data-overflow \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "PolicyRadar Parquet overflow" \
              --notes "Compressed Parquet rows that do not fit in the 50MB git snapshot. Historical DuckDB LFS pointers stay in the repository."
          fi
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            gh release upload data-overflow \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              "data/release/${name}"
          done < data/release/UPLOAD

      - name: Restore historical DuckDB pointers
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          tracked=()
          while IFS= read -r -d '' file; do
            tracked+=("$file")
          done < <(git ls-files -z -- 'data/*.duckdb' 'data/daily/*.duckdb')
          if [ ${#tracked[@]} -gt 0 ]; then
            git -c filter.lfs.smudge= -c filter.lfs.process= -c filter.lfs.required=false checkout -- "${tracked[@]}"
          fi

      - name: Auto-commit data updates
        # A rejected push still fails the job. DuckDB paths are excluded so this
        # step does not upload Git LFS objects.
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update radar data [skip ci]"
          file_pattern: "data/parquet/ data/raw/ reports/ :(exclude)data/**/*.duckdb :(exclude)data/*.duckdb :(exclude)data/release/** :(exclude)data/work/** :(exclude)data/search_index.db* :(exclude)*.lfspointer"
          add_options: "-f"
          skip_fetch: false
          skip_checkout: false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./reports
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "docs: update radar report"
          cname: ""  # Add custom domain if needed

      - name: Archive DuckDB (30-day backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-db-${{ github.run_number }}
          path: |
            data/work/radar_data.duckdb
            data/radar_data.duckdb
          retention-days: 30
          if-no-files-found: ignore

      - name: Archive reports (30-day backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Create workflow summary
        if: always()
        run: |
          echo "## 📊 Radar Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Category**: ${{ env.RADAR_CATEGORY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "reports/index.html" ]; then
            echo "✅ Report generated successfully" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "data/parquet/articles.parquet" ]; then
            SIZE=$(du -h data/parquet/articles.parquet | cut -f1)
            echo "✅ Parquet snapshot ($SIZE)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "data/work/radar_data.duckdb" ]; then
            SIZE=$(du -h data/work/radar_data.duckdb | cut -f1)
            echo "✅ Working DuckDB backed up ($SIZE)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.NOTIFICATION_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "status": "failure",
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }' || true
