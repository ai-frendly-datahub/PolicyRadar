category_name: policy
display_name: 정책/약관 레이더
data_quality:
  priority: P0
  primary_motion: compliance-risk
  weakest_dimension: operational_depth
  quality_outputs:
    freshness_report: reports/policy_quality.json
    dated_freshness_report_pattern: reports/policy_YYYYMMDD_quality.json
    tracked_event_models:
    - public_consultation
    - enforcement_action
    - policy_effective_date
    - platform_policy_change
    - security_classification_framework
  event_models:
  - public_consultation
  - enforcement_action
  - policy_effective_date
  - platform_policy_change
  - security_classification_framework
  canonical_keys:
    policy_document:
      fields:
      - source
      - document_id
      - title
      - published
    consultation:
      fields:
      - agency
      - docket_id
      - comment_deadline
    enforcement_case:
      fields:
      - agency
      - case_name
      - action_date
    platform_policy:
      fields:
      - platform
      - policy_area
      - effective_date
  freshness_sla:
    public_consultation:
      max_age_days: 1
      stale_after_days: 3
    enforcement_action:
      max_age_days: 1
      stale_after_days: 3
    policy_effective_date:
      max_age_days: 2
      stale_after_days: 7
    platform_policy_change:
      max_age_days: 2
      stale_after_days: 5
    security_classification_framework:
      max_age_days: 7
      stale_after_days: 30
  quality_gates:
  - 공식 N2SF 3등급과 내부 운영 오버레이를 분리해 저장
  - 의견수렴 마감일·시행일·공포일·수집일을 별도 필드로 유지
  - 집행/제재 신호는 공식 agency source 없이는 확정 상태로 병합하지 않음
  - 정책 변경 diff는 원문 URL과 변경 적용일을 함께 보존
source_backlog:
  consultation_candidates:
  - id: regulations_gov_documents_api
    name: Regulations.gov Documents API
    url: https://open.gsa.gov/api/regulationsgov/
    layer: operational
    event_model: public_consultation
    activation_gate: API key, docket id mapping, comment deadline parser 검증 후 활성화
  - id: korea_lawmaking_notice
    name: 대한민국 입법예고/행정예고
    url: https://www.lawmaking.go.kr/
    layer: operational
    event_model: public_consultation
    activation_gate: 목록 selector, 부처명 정규화, 의견제출 마감일 parser 검증 후 활성화
  enforcement_candidates:
  - id: ftc_cases_and_proceedings
    name: FTC Cases and Proceedings
    url: https://www.ftc.gov/legal-library/browse/cases-proceedings
    layer: official
    event_model: enforcement_action
    activation_gate: case id, order date, penalty/settlement 상태 parser 검증 후 활성화
  - id: pipc_decision_archive
    name: PIPC 심의·의결/처분 아카이브
    url: https://www.pipc.go.kr/
    layer: official
    event_model: enforcement_action
    activation_gate: 게시판별 개인정보 처리·첨부파일 접근·처분일 parser 검증 후 활성화
  platform_policy_candidates:
  - id: platform_policy_pages
    name: Platform policy and developer policy pages
    url: ''
    layer: operational
    event_model: platform_policy_change
    activation_gate: robots/ToS, diff hash, effective date 추출 검증 후 활성화
